server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name 8.133.190.46;
    if ($http_host !~ "^8\.133\.190\.46(:80)?$") { return 444; }

    location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
        root /var/lib/crm-acme/webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://8.133.190.46$request_uri;
    }
}
