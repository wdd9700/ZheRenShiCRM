map $http_upgrade $crm_connection_upgrade {
    default upgrade;
    '' close;
}
map $http_origin $crm_socket_origin_ok {
    default 0;
    '' 1;
    'https://8.133.190.46' 1;
    'https://8.133.190.46:443' 1;
}
map "$arg_cmd:$request_method:$uri" $crm_login_key {
    default '';
    ~^login:POST: $binary_remote_addr;
    ~^[^:]*:POST:(/|/login|/api/method/login)/?$ $binary_remote_addr;
}
limit_req_zone $crm_login_key zone=crm_login:1m rate=5r/m;

server {
    listen 443 ssl default_server;
    server_name 8.133.190.46;
    if ($http_host !~ "^8\.133\.190\.46(:443)?$") { return 444; }

    ssl_certificate /etc/crm-acme/production/live/crm-public-ip/fullchain.pem;
    ssl_certificate_key /etc/crm-acme/production/live/crm-public-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CRM_TLS:1m;
    ssl_session_timeout 1h;
    server_tokens off;
    client_max_body_size 50m;
    limit_req zone=crm_login burst=5 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_cookie_flags ~ secure;
    proxy_redirect http://8.133.190.46/ https://8.133.190.46/;
    proxy_redirect http://crm.localhost/ https://8.133.190.46/;
    proxy_redirect https://crm.localhost/ https://8.133.190.46/;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /updates/windows {
        return 404;
    }

    location ~ "^/updates/windows/manifest\.(json|sig)$" {
        root /var/lib/crm-public/current;
        try_files $uri =404;
        autoindex off;
        gzip off;
        types { application/json json; application/octet-stream sig; }
        add_header Cache-Control 'no-store' always;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location ~ "^/updates/windows/PhilosopherStoneCRM-Setup-[0-9]+\.[0-9]+\.[0-9]+-x64\.exe$" {
        root /var/lib/crm-public/current;
        try_files $uri =404;
        autoindex off;
        gzip off;
        default_type application/octet-stream;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location /updates/windows/ {
        return 404;
    }

    location /socket.io {
        if ($crm_socket_origin_ok = 0) { return 403; }
        proxy_set_header Host 8.133.190.46;
        proxy_set_header X-Frappe-Site-Name crm.localhost;
        proxy_set_header X-Forwarded-Host 8.133.190.46;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded '';
        proxy_set_header X-Forwarded-Ssl '';
        proxy_set_header X-Forwarded-Protocol '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $crm_connection_upgrade;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8088;
    }

    location / {
        proxy_set_header Connection '';
        proxy_set_header Host 8.133.190.46;
        proxy_set_header X-Frappe-Site-Name crm.localhost;
        proxy_set_header X-Forwarded-Host 8.133.190.46;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded '';
        proxy_set_header X-Forwarded-Ssl '';
        proxy_set_header X-Forwarded-Protocol '';
        proxy_pass http://127.0.0.1:8088;
    }
}
